<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Likes - Envio Simples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .status.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .status p {
            margin: 0;
            font-size: 14px;
        }

        .history {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .history h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .history-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            border-left: 4px solid #667eea;
        }

        .history-item strong {
            color: #333;
        }

        .history-item p {
            margin: 4px 0;
            color: #666;
        }

        .history-item .time {
            color: #999;
            font-size: 12px;
        }

        .empty-history {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }

        .stats {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-item .label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Free Fire</h1>
            <p>Envio de Likes - Região Africana</p>
        </div>

        <div class="alert alert-info">
            ℹ️ Preencha os dados abaixo para enviar likes para sua conta Free Fire
        </div>

        <form id="likeForm">
            <div class="form-group">
                <label for="senderAccount">Sua Conta Free Fire (ID)</label>
                <input type="text" id="senderAccount" placeholder="Ex: 123456789" required>
            </div>

            <div class="form-group">
                <label for="receiverAccount">Conta Receptora (ID)</label>
                <input type="text" id="receiverAccount" placeholder="Ex: 987654321" required>
            </div>

            <div class="form-group">
                <label for="quantity">Quantidade de Likes</label>
                <input type="number" id="quantity" min="1" max="10000" value="100" required>
            </div>

            <div class="form-group">
                <label for="country">País</label>
                <select id="country" required>
                    <option value="">Selecione seu país</option>
                    <option value="MZ">🇲🇿 Moçambique (MZ)</option>
                    <option value="AO">🇦🇴 Angola (AO)</option>
                    <option value="CV">🇨🇻 Cabo Verde (CV)</option>
                    <option value="GB">🇬🇼 Guiné-Bissau (GB)</option>
                    <option value="ST">🇸🇹 São Tomé e Príncipe (ST)</option>
                    <option value="GQ">🇬🇶 Guiné Equatorial (GQ)</option>
                </select>
            </div>

            <button type="submit" id="sendBtn">Enviar Likes</button>
        </form>

        <div class="status" id="status"></div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="number" id="totalLikes">0</div>
                <div class="label">Total de Likes</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalEnvios">0</div>
                <div class="label">Total de Envios</div>
            </div>
        </div>

        <div class="history" id="history">
            <h2>📊 Histórico Recente</h2>
            <div id="historyList" class="empty-history">Nenhum envio realizado ainda</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const form = document.getElementById('likeForm');
        const statusDiv = document.getElementById('status');
        const historyList = document.getElementById('historyList');
        const statsDiv = document.getElementById('stats');
        const sendBtn = document.getElementById('sendBtn');

        // Carregar histórico ao iniciar
        loadHistory();
        updateStats();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const senderAccount = document.getElementById('senderAccount').value;
            const receiverAccount = document.getElementById('receiverAccount').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const country = document.getElementById('country').value;

            if (!senderAccount || !receiverAccount || !quantity || !country) {
                showStatus('Por favor, preencha todos os campos', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading-spinner"></span>Enviando...';
            showStatus('Enviando likes...', 'loading');

            try {
                const response = await fetch(`${API_URL}/likes/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sender_account: senderAccount,
                        receiver_account: receiverAccount,
                        quantity: quantity,
                        country: country
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(`✅ Sucesso! ${quantity} likes enviados para ${receiverAccount}!`, 'success');
                    form.reset();
                    await loadHistory();
                    updateStats();
                } else {
                    showStatus(`❌ Erro: ${data.detail || data.message || 'Erro desconhecido'}`, 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showStatus(`❌ Erro de conexão: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = 'Enviar Likes';
            }
        });

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 4000);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/likes/history`);
                const data = await response.json();

                if (data.likes && data.likes.length > 0) {
                    const recent = data.likes.slice(-5).reverse();
                    historyList.innerHTML = recent.map(like => {
                        const date = new Date(like.timestamp);
                        const timeStr = date.toLocaleTimeString('pt-BR');
                        const dateStr = date.toLocaleDateString('pt-BR');

                        return `
                            <div class="history-item">
                                <strong>${like.quantity} likes</strong>
                                <p>De: ${like.sender} → Para: ${like.receiver}</p>
                                <p>País: ${like.country}</p>
                                <div class="time">📅 ${dateStr} ${timeStr}</div>
                            </div>
                        `;
                    }).join('');
                } else {
                    historyList.innerHTML = '<div class="empty-history">Nenhum envio realizado ainda</div>';
                }
            } catch (error) {
                console.error('Erro ao carregar histórico:', error);
            }
        }

        async function updateStats() {
            try {
                const response = await fetch(`${API_URL}/likes/stats`);
                const data = await response.json();

                document.getElementById('totalLikes').textContent = data.total_likes_sent.toLocaleString('pt-BR');
                document.getElementById('totalEnvios').textContent = data.total_transactions;
                statsDiv.style.display = 'grid';
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }

        // Recarregar histórico a cada 10 segundos
        setInterval(async () => {
            await loadHistory();
        }, 10000);

        // Validação em tempo real
        document.getElementById('quantity').addEventListener('change', (e) => {
            const value = parseInt(e.target.value);
            if (value > 10000) {
                e.target.value = 10000;
                showStatus('Máximo de 10.000 likes por envio', 'error');
            }
        });
    </script>
</body>
</html>
